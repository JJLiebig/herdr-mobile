name: Draft checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: draft-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check.mjs
