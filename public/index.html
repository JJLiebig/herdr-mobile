<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1b2024"><meta name="description" content="Your existing Herdr sessions, on your phone.">
<title>Herdr Mobile</title><link rel="icon" href="/icon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/focus.css"><script type="module" src="/app.mjs"></script>
</head>
<body>
<div class="shell">
<header class="topbar"><a class="wordmark" href="#" aria-label="Herdr overview">herdr</a><div class="top-actions"><select id="host" aria-label="Machine"></select><button id="settings-button" class="icon-button" aria-label="Open settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg></button></div></header>
<div id="connection" class="connection" role="status">Connecting to companion…</div>
<main id="overview">
<nav class="landing-tabs" aria-label="Browse sessions" role="tablist"><button id="priority-tab" type="button" role="tab" aria-selected="true" aria-controls="priority-panel">Priority</button><button id="spaces-tab" type="button" role="tab" aria-selected="false" aria-controls="spaces-panel" tabindex="-1">Spaces</button></nav>
<section id="priority-panel" role="tabpanel" aria-labelledby="priority-tab"><div id="priority-list"></div></section>
<section id="spaces-panel" role="tabpanel" aria-labelledby="spaces-tab" hidden><div id="spaces-tree"></div></section>
</main>
<main id="focus" hidden>
<header class="focus-heading"><button id="back" aria-label="Back to agents"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14 6-6 6 6 6"/></svg></button><div class="thread-identity"><div class="thread-title-row"><span id="focus-dot" class="status-dot" aria-hidden="true"></span><h1 id="focus-title"></h1></div><div class="thread-meta"><div id="breadcrumb"></div><span id="focus-status" role="status"></span></div></div><span id="focus-host" hidden></span><button id="latest" aria-label="Scroll down through output"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v14m-5-5 5 5 5-5"/></svg></button></header>
<div class="output-wrap"><div id="terminal" tabindex="0" aria-label="Selected agent output"></div><div class="output-heading"><span id="output-status">Connecting…</span></div>
<div class="input-controls"><button id="input-toggle" class="input-puck" type="button" aria-label="Open keyboard" aria-expanded="false" aria-controls="terminal-keys" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M6 9h1m3 0h1m3 0h1m3 0h.1M6 12h1m3 0h1m3 0h1m3 0h.1M7 15h10"/></svg></button></div></div>
<div id="terminal-keys" class="keybar" aria-label="Terminal controls" hidden><button id="key-Escape" disabled>Esc</button><button id="key-Tab" disabled>Tab</button><button id="key-Shift" aria-pressed="false" title="Shift for the next terminal key" disabled>Shift</button><button id="key-ArrowUp" disabled aria-label="Up arrow">↑</button><button id="key-ArrowDown" disabled aria-label="Down arrow">↓</button><button id="key-Enter" disabled>Enter</button><button id="keys-close" aria-label="Close terminal keys">×</button></div>
<div id="message" class="message" role="status" aria-live="polite"></div>
</main>
</div>
<dialog id="settings"><div class="dialog-head"><h2>Mobile settings</h2><button id="close-settings" class="icon-button" aria-label="Close settings">×</button></div><p id="settings-mode"></p><p>Typing goes directly to the open terminal. Voice input is coming later.</p></dialog>
<noscript>This application needs JavaScript.</noscript>
</body></html>
